<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Notification Bridge</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
    }
    h2 {
      margin: 0 0 15px 0;
      font-size: 16px;
      color: #333;
    }
    .notification-item {
      display: flex;
      align-items: center;
      padding: 10px;
      margin-bottom: 10px;
      background: #f5f5f5;
      border-radius: 6px;
    }
    .notification-item img {
      width: 24px;
      height: 24px;
      margin-right: 10px;
    }
    .notification-info {
      flex: 1;
    }
    .source-name {
      font-weight: 600;
      color: #333;
    }
    .count {
      color: #666;
      font-size: 12px;
    }
    .badge {
      background: #e74c3c;
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
    }
    .status {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
      font-size: 12px;
      color: #999;
    }
    .refresh-btn {
      margin-top: 10px;
      padding: 8px 15px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    .refresh-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h2>📬 Notification Bridge</h2>
  <div id="notifications"></div>
  <button class="refresh-btn" id="refresh">Refresh Now</button>
  <div class="status" id="status">Loading...</div>
  
  <script src="popup.js"></script>
</body>
</html>
